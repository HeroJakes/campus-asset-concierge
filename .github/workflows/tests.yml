name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: Check booking search interactions
        run: node --test tests/booking_search.test.cjs
      - name: Run tests with the Firestore emulator
        env:
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
        run: >
          npx --yes firebase-tools@15.35.0 emulators:exec --only firestore
          --project demo-campus-asset-concierge "uv run --locked pytest"
