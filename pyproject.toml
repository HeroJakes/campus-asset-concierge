[project]
name = "campus-asset-concierge"
version = "0.1.0"
description = "Governed shared-equipment lending and overdue recovery for campus operations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "google-adk",
    "google-cloud-firestore",
    "google-genai>=2.34.0",
    "itsdangerous>=2.2.0",
    "jinja2",
    "mcp<2",
    "python-multipart>=0.0.33",
    "uvicorn",
]

[project.scripts]
dev = "campus_asset_concierge.dev:main"
dev-collections = "campus_asset_concierge.emulator_collections:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
