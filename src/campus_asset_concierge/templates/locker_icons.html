{% macro icon(kind, size=22) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if kind == 'home' %}<path d="m3 10 9-7 9 7v10H15v-6H9v6H3Z"/>
{% elif kind == 'calendar' %}<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16m-11 4h2"/>
{% elif kind == 'activity' %}<path d="M2 12h5l3-8 4 16 3-8h5"/>
{% elif kind == 'alert' %}<path d="m10 4-8 15a1 1 0 0 0 1 2h18a1 1 0 0 0 1-2L14 4a2 2 0 0 0-4 0Z"/><path d="M12 9v4m0 4h.01"/>
{% elif kind == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>
{% elif kind == 'refresh' %}<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 6a8 8 0 0 1 13 3M5 15a8 8 0 0 0 13 3"/>
{% elif kind == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif kind == 'chevron' %}<path d="m14 6-6 6 6 6"/>
{% elif kind == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif kind == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif kind == 'user' %}<circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
{% elif kind == 'briefcase' %}<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12h18m-9-2v4"/>
{% elif kind == 'bolt' %}<path d="m13 2-9 12h7l-1 8 10-13h-7Z"/>
{% elif kind == 'layers' %}<path d="m12 3 10 5-10 5L2 8Zm-9 10 9 5 9-5m-18 5 9 5 9-5"/>
{% elif kind == 'shield' %}<path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z"/><path d="m8 12 3 3 5-6"/>
{% elif kind == 'eye' %}<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
{% elif kind == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif kind == 'lock' or kind == 'open' %}<rect x="5" y="10" width="14" height="11" rx="2"/>{% if kind == 'open' %}<path d="M9 10V6a4 4 0 0 1 8 0"/>{% else %}<path d="M8 10V6a4 4 0 0 1 8 0v4"/>{% endif %}<path d="M12 15v2"/>
{% else %}<path d="m12 2 9 5v10l-9 5-9-5V7Z"/><path d="m3 7 9 5 9-5m-9 5v10M7.5 4.5l9 5"/>
{% endif %}
</svg>
{%- endmacro %}
