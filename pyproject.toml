[project]
name = "campus-asset-concierge"
version = "0.1.0"
description = "Governed shared-equipment lending and overdue recovery for campus operations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "google-adk",
    "google-cloud-firestore",
    "jinja2",
    "mcp<2",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
