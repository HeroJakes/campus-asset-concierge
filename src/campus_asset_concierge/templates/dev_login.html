<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev login · Campus Asset Concierge</title>
  <link rel="stylesheet" href="/static/locker.css">
</head>
<body>
  <main class="canvas">
    <section class="panel" aria-labelledby="login-title">
      <h1 id="login-title">Dev login</h1>
      <p>Choose a demo account. No password is needed.</p>
      <p>Local development only. Actions change the configured demo database.</p>
      {% for account in accounts %}
      <form action="/dev-login/{{ account }}" method="post">
        <button class="button button--primary" type="submit">{{ account }}</button>
      </form>
      {% endfor %}
    </section>
  </main>
</body>
</html>
